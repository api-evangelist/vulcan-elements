aid: vulcan-elements
name: Vulcan Elements
description: 'Vulcan Elements is a United States manufacturer of sintered permanent
  neodymium-iron-boron (NdFeB) rare earth magnets, founded in 2023 and headquartered
  in Research Triangle Park, North Carolina. The company produces high-performance
  rare earth magnets domestically for defense and commercial applications — the components
  that convert electricity into motion in motors, drones, robotics, vehicles and consumer
  electronics — as an alternative to a supply chain concentrated in China. In 2025
  it announced a $65 million Series A, a $620 million loan from the Pentagon''s Office
  of Strategic Capital, and a $1.4 billion partnership with the U.S. government and
  ReElement Technologies to build a vertically integrated domestic magnet supply chain,
  including a nearly $1 billion, 1,000-job magnet factory in Benson, Johnston County,
  North Carolina. Vulcan Elements is a physical-goods manufacturer: it publishes no
  public API, developer portal, SDK or machine-readable specification.'
